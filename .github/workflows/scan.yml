name: 'CodeQL Analysis'

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze_driver:
    name: analyze-driver
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          fetch-depth: 0

      - name: Nuget Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
        with:
          path: |
            packages
            ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.config', '**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json', '**/NuGet.Config', '**/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Nuget Restore
        shell: cmd
        run: nuget restore .\packages.config -PackagesDirectory .\packages\

      - name: Build Tools
        shell: cmd
        run: build\build_init.cmd

      - name: Initialize CodeQL
        id: init
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # 4.38.3
        with:
          languages: cpp

      - name: Github Annotations
        shell: cmd
        run: echo ::add-matcher::.github/msvc-matcher.json

      - name: Build Driver
        shell: cmd
        run: build\build_zdriver.cmd

      - name: Finalize CodeQL Database
        shell: pwsh
        run: |
          & "${{ steps.init.outputs.codeql-path }}" database finalize "${{ runner.temp }}\codeql_databases\cpp"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download Windows Driver Query Packs
        shell: pwsh
        run: |
          & "${{ steps.init.outputs.codeql-path }}" pack download microsoft/windows-drivers microsoft/cpp-queries@0.0.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows Driver Analysis
        shell: pwsh
        run: |
          $sarifOut = Join-Path "${{ runner.temp }}" "driver-analysis.sarif"
          & "${{ steps.init.outputs.codeql-path }}" database analyze "${{ runner.temp }}\codeql_databases\cpp" `
            microsoft/windows-drivers `
            --sarif-category=/driver `
            --format=sarifv2.1.0 `
            --output=$sarifOut
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Filter CodeQL Results
        uses: advanced-security/filter-sarif@2da736ff05ef065cb2894ac6892e47b5eac2c3c0 # 1.1
        with:
          input: ${{ runner.temp }}\driver-analysis.sarif
          output: ${{ runner.temp }}\driver-filtered.sarif
          patterns: |
            -packages/**

      - name: Upload CodeQL Results
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # 4.38.3
        with:
          sarif_file: ${{ runner.temp }}\driver-filtered.sarif
          category: /driver

  analyze_library:
    name: analyze-software
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          fetch-depth: 0

      - name: Nuget Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
        with:
          path: |
            packages
            ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.config', '**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json', '**/NuGet.Config', '**/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Nuget Restore
        shell: cmd
        run: nuget restore .\packages.config -PackagesDirectory .\packages\

      - name: Build Init
        shell: cmd
        run: build\build_init.cmd

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # 4.38.3
        with:
          languages: cpp

      - name: Github Annotations
        shell: cmd
        run: echo ::add-matcher::.github/msvc-matcher.json

      - name: Build Release
        shell: cmd
        run: build\build_release.cmd

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # 4.38.3
        with:
          category: /language:cpp
          output: sarif-results
          upload: never

      - name: Filter CodeQL Results
        uses: advanced-security/filter-sarif@2da736ff05ef065cb2894ac6892e47b5eac2c3c0 # 1.1
        with:
          input: sarif-results/cpp.sarif
          output: sarif-results/filtered.sarif
          patterns: |
            -packages/**
            -tools/CustomBuildTool/generated/**
            -tools/CustomBuildTool/obj/**

      - name: Upload CodeQL Results
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # 4.38.3
        with:
          sarif_file: sarif-results/filtered.sarif
          category: /language:cpp

  analyze_csharp:
    name: analyze-tools
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          fetch-depth: 0

      - name: Nuget Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
        with:
          path: |
            packages
            ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.config', '**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json', '**/NuGet.Config', '**/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Nuget Restore
        shell: cmd
        run: nuget restore .\packages.config -PackagesDirectory .\packages\

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # 4.38.3
        with:
          languages: csharp
          queries: security-and-quality

      - name: Build Tools
        shell: cmd
        run: build\build_init.cmd

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # 4.38.3
        with:
          category: /language:csharp
          output: sarif-results
          upload: never

      - name: Filter CodeQL Results
        uses: advanced-security/filter-sarif@2da736ff05ef065cb2894ac6892e47b5eac2c3c0 # 1.1
        with:
          input: sarif-results/csharp.sarif
          output: sarif-results/filtered.sarif
          patterns: |
            -packages/**
            -tools/CustomBuildTool/generated/**
            -tools/CustomBuildTool/obj/**

      - name: Upload CodeQL Results
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # 4.38.3
        with:
          sarif_file: sarif-results/filtered.sarif
          category: /language:csharp

  analyze_actions:
    name: analyze-workflows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # 4.38.3
        with:
          languages: actions
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # 4.38.3
        with:
          category: /language:actions
